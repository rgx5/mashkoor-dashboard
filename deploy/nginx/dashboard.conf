# nginx vhost for the Mashkoor dashboard (Admin / B2B / B2C portals, /pay/:token, /i/:token — a static React build,
# plus the API on /api). HTTPS is added automatically by certbot, which rewrites this file to add the SSL server
# block and the HTTP → HTTPS redirect — don't hand-write those parts.
#
# Install:
#   ln -s /var/www/mashkoor/mashkoor-dashboard/deploy/nginx/dashboard.conf /etc/nginx/sites-available/mashkoor-dashboard.conf
#   ln -s /etc/nginx/sites-available/mashkoor-dashboard.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mashkoor.rapidrabbit.cloud
#
# Currently pointed at the staging domain (mashkoor.rapidrabbit.cloud). The real app.mashkoor.co.in block is
# commented out below — switch to it (and rerun certbot for that domain) once DNS for it is ready.

server {
	listen 80;
	listen [::]:80;
	server_name mashkoor.rapidrabbit.cloud;

	client_max_body_size 12m;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	location /api/ {
		proxy_pass http://127.0.0.1:4000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
	}

	# Hashed build files never change, so browsers may keep them for a year.
	location /assets/ {
		root /var/www/mashkoor-app;
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Everything else is a client-side route (/admin, /b2c/trips/…), so it gets index.html.
	location / {
		root /var/www/mashkoor-app;
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}
}

